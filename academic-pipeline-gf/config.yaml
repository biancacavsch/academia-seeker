# Academic Pipeline Configuration — História / Literatura / Gótico / Terror
# Perfil: História, História da Literatura, História da/na América Latina,
# Literatura Latino-Americana, Gótico, Terror/Horror e afins.
# Pipeline separado do job-pipeline (uso próprio da namorada).
# Bolsa: já está no mestrado → programas de mestrado puro são rejeitados.

sources: []  # não há fontes de vagas neste pipeline (academic-only)

# ================= Fontes acadêmicas (CFPs, eventos, bolsas) =================
academic_sources:
  # --- UPenn Call for Papers (humanidades) ---
  - name: upenn_cfp
    enabled: true
    type: html
    url: "https://call-for-papers.sas.upenn.edu"
    category: "publicacao"
    rate_limit: 3.0
    params:
      categories:
        - "history"
        - "latin-american-history"
        - "literature"
        - "comparative-literature"
        - "spanish-and-portuguese"
        - "gothic-studies"
      max_pages: 3

  # --- WikiCFP ---
  - name: wikicfp
    enabled: true
    type: rss
    url: "https://wikicfp.com/cfp/servlet/event.showcfp?feed=rss"
    category: "cfp"
    rate_limit: 3.0
    params:
      categories: ["history", "literature", "philosophy", "humanities", "spanish", "portuguese"]

  # --- H-Net Announcements (história, literatura, LatAm) ---
  - name: hnet_announcements
    enabled: true
    type: rss
    url: "https://networks.h-net.org/rss/announcements"
    category: "event"
    rate_limit: 3.0
    params:
      keywords: ["history", "historia", "história", "literature", "literatura",
                 "latin america", "américa latina", "latinoamérica",
                 "gothic", "gótico", "terror", "horror",
                 "colonial", "colonialismo", "pós-colonial",
                 "literatura latino-americana", "latin american literature"]

  # --- Euraxess (bolsas/pesquisa Europa) ---
  - name: euraxess
    enabled: true
    type: rss
    url: "https://euraxess.ec.europa.eu/job-feed"
    category: "bolsa"
    rate_limit: 3.0

  # --- PhilPapers CFP (filosofia/literatura) ---
  - name: philpapers_cfp
    enabled: true
    type: rss
    url: "https://philpapers.org/rss/cfp/"
    category: "cfp"
    rate_limit: 3.0

  # --- Scraping genérico (adicione fontes aqui) ---
  # Exemplo:
  # - name: minha_fonte_custom
  #   enabled: false
  #   type: html
  #   url: "https://exemplo.com/cfps"
  #   category: "cfp"
  #   rate_limit: 5.0

# ================= Busca web acadêmica (história/literatura/LatAm/gótico/terror) =================
academic_search:
  enabled: true
  engines: ["ddgs", "marginalia"]
  timelimit: "m"
  max_results_per_query: 10
  page_budget: 100
  request_delay: 2.0
  exclude_domains:
    - "linkedin.com"
    - "facebook.com"
    - "instagram.com"
    - "twitter.com"
    - "x.com"
    - "tiktok.com"
    - "wikipedia.org"
    - "youtube.com"
  queries:
    # História (PT/EN/ES)
    historia_pt:
      - "chamada de artigos história"
      - "chamada de trabalhos história"
      - "edital bolsa pesquisa história"
      - "congresso história 2027"
      - "CFP história brasileira"
      - "chamada capítulos história"
    historia_en:
      - "call for papers history"
      - "CFP history conference 2027"
      - "history fellowship research"
      - "call for papers colonial history"
      - "history journal special issue"
    historia_es:
      - "convocatoria artículos historia"
      - "convocatoria congreso historia"
      - "beca investigación historia"
      - "convocatoria historia latinoamericana"

    # História da Literatura
    historia_literatura_pt:
      - "chamada de artigos história da literatura"
      - "chamada de trabalhos literatura brasileira"
      - "edital bolsa pesquisa literatura"
      - "congresso literatura brasileira 2027"
      - "CFP literatura brasileira"
    historia_literatura_en:
      - "call for papers history of literature"
      - "CFP literary history"
      - "call for papers Brazilian literature"
      - "literature conference 2027 CFP"
    historia_literatura_es:
      - "convocatoria artículos historia de la literatura"
      - "convocatoria congreso literatura"
      - "beca investigación literatura"

    # História da/na América Latina
    america_latina_pt:
      - "chamada de artigos América Latina"
      - "chamada de trabalhos história América Latina"
      - "edital bolsa pesquisa América Latina"
      - "congresso história América Latina 2027"
      - "CFP América Latina humanidades"
    america_latina_en:
      - "call for papers Latin America history"
      - "CFP Latin American history conference"
      - "call for papers Latin America literature"
      - "Latin American studies conference 2027"
    america_latina_es:
      - "convocatoria artículos América Latina"
      - "convocatoria congreso historia América Latina"
      - "beca investigación América Latina"
      - "convocatoria historia latinoamericana"

    # Literatura Latino-Americana
    literatura_latina_pt:
      - "chamada de artigos literatura latino-americana"
      - "chamada de trabalhos literatura latino americana"
      - "edital bolsa pesquisa literatura latino-americana"
      - "congresso literatura latino-americana 2027"
      - "CFP literatura latino americana"
    literatura_latina_en:
      - "call for papers Latin American literature"
      - "CFP Latin American literature conference"
      - "call for papers Latino literature"
      - "Latin American literature journal special issue"
    literatura_latina_es:
      - "convocatoria artículos literatura latinoamericana"
      - "convocatoria congreso literatura latinoamericana"
      - "beca investigación literatura latinoamericana"

    # Gótico / Terror / Horror
    gotico_pt:
      - "chamada de artigos gótico"
      - "chamada de trabalhos gótico horror"
      - "edital bolsa pesquisa gótico terror"
      - "congresso gótico terror 2027"
      - "CFP gótico terror horror"
    gotico_en:
      - "call for papers gothic"
      - "CFP gothic studies conference"
      - "call for papers horror"
      - "CFP horror studies"
      - "gothic literature conference 2027"
      - "horror fiction call for papers"
    gotico_es:
      - "convocatoria artículos gótico"
      - "convocatoria congreso gótico terror"
      - "beca investigación gótico terror"

