# ================= Alertas =================
alerts:
  telegram:
    enabled: true  # defina true + configure bot_token/chat_id em .env
    bot_token: "SEU_BOT_TOKEN_AQUI"
    chat_id: "SEU_CHAT_ID_AQUI"
  email:
    enabled: true  # defina true + configure SMTP em .env
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    smtp_user: "SEU_EMAIL@gmail.com"
    smtp_pass: "SUA_SENHA_DE_APP"
    from_email: "SEU_EMAIL@gmail.com"
    to_email: "EMAIL_DE_DESTINO@gmail.com"

# ================= Armazenamento (apenas banco acadêmico) =================
storage:
  db_path_academic: "academic.db"  # bolsas/eventos/chamadas
  db_path: "academic.db"           # fallback
  dedup_by: "url_hash"

# ================= Execução =================
runtime:
  user_agent: "Mozilla/5.0 (compatible; AcademicPipeline/1.0; +https://github.com)"
  timeout: 30
  max_retries: 3
