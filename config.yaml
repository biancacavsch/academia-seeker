# Busca por empresa-alvo (links diretos para Gupy/LinkedIn/Indeed)
# Edite a lista de empresas conforme seu interesse
empresas_alvo:
  enabled: true
  engines: ["ddgs"]
  timelimit: "m"
  max_results_per_query: 4
  page_budget: 25
  request_delay: 3.0          # pausa entre buscas (evita rate-limit do ddgs)
  exclude_domains:
    # linkedin.com NÃO está aqui de propósito: as queries site:linkedin.com/jobs
    # retornam só páginas de vaga; is_job_page() rejeita perfil/busca/salário.
    - "facebook.com"
    - "instagram.com"
    - "wikipedia.org"
  empresas:
    # Comunicação / redes sociais / conteúdo (seu perfil E-life)
    - "Globo"
    - "UOL"
    - "Magazine Luiza"
    - "Nubank"
    - "iFood"
    - "Hotmart"
    - "Sympla"
    - "Google"
    # Marketing/design/remoto (fit estágio remoto)
    - "Canva"
    - "HubSpot"
    - "TikTok"
    # Cultura/educação (fit humanidades + divulgação)
    - "Itaú Cultural"
    - "Alura"
  queries:
    pt:
      - "site:gupy.io {empresa} estágio remoto"
      - "site:gupy.io {empresa} estágio home office"
      - "site:linkedin.com/jobs {empresa} estágio remoto"
      - "site:indeed.com.br {empresa} estágio"
    en:
      - "site:linkedin.com/jobs {empresa} remote internship"
      - "site:indeed.com {empresa} remote internship"

