# Job Pipeline Configuration
# Perfil: Ciências Sociais + Mestrado em Divulgação Científica/Cultural + Humanidades Digitais

sources:
  # APIs gratuitas sem auth
  - name: arbeitnow
    enabled: true
    type: api
    base_url: "https://www.arbeitnow.com/api/job-board-api"
    params:
      remote: true
      max_pages: 3
    rate_limit: 1.0  # segundos entre requests

  - name: remotive
    enabled: true
    type: api
    base_url: "https://remotive.com/api/remote-jobs"
    params:
      max_pages: 5
    rate_limit: 1.0

  - name: remotejobs_org
    enabled: true
    type: api
    base_url: "https://remotejobs.org/api/v1/jobs"
    params:
      limit: 50
      max_pages: 3
    rate_limit: 1.0

  # APIs com chave free (configure no .env)
  - name: adzuna
    enabled: true
    type: api
    base_url: "https://api.adzuna.com/v1/api/jobs"
    params:
      countries: ["br", "us", "gb", "es"]
      what_or: "humanities museum archives culture history education research writer"
      results_per_page: 50
      max_pages: 2
    rate_limit: 2.0

  - name: jooble
    enabled: true  # chave JOOBLE_API_KEY no .env (limite: 100 req/dia)
    type: api
    base_url: "https://jooble.org/api"
    params:
      what: "digital humanities OR science communication OR cultural heritage"
      where: "remote"
      max_pages: 3
    rate_limit: 2.0

  # RSS feeds nichados DH
  - name: dhnow_jobs
    enabled: true
    type: rss
    url: "https://digitalhumanitiesnow.org/category/news/job/feed/"
    rate_limit: 2.0

  - name: archives_gig_dh
    enabled: true
    type: rss
    url: "https://archivesgig.com/tag/digital-humanities/feed/"
    rate_limit: 2.0

  # Vagas de pesquisa na Europa (RSS oficial; maioria presencial — filtro remote_only aplica)
  - name: euraxess
    enabled: true
    type: rss
    url: "https://euraxess.ec.europa.eu/job-feed"
    rate_limit: 2.0

  # ===== Estágios remotos / home office =====
  # Adzuna com termos de estágio (API já funcional com chaves no .env)
  # NOTA: "pt" NÃO é país válido na API Adzuna (404) — só códigos ISO de país
  - name: adzuna_estagio
    enabled: true
    type: api
    kind: estagio
    base_url: "https://api.adzuna.com/v1/api/jobs"
    params:
      countries: ["br", "us", "gb", "es"]
      what_or: "estágio estagio internship trainee jovem aprendiz"
      results_per_page: 50
      max_pages: 2
    rate_limit: 2.0

  # Busca web por estágios (ddgs) — cobertura BR + internacional
  - name: estagio_search
    enabled: true
    type: search
    kind: estagio
    rate_limit: 2.0

  # Vagas.com.br (listagem HTML de estágio home office — httpx+bs4, sem Playwright)
  - name: vagas_estagio
    enabled: true
    type: html_job
    kind: estagio
    url: "https://www.vagas.com.br/vagas-de-estagio-home-office"
    rate_limit: 3.0
    params:
      selector: "li.vaga"
      title_selector: "h2.cargo a"
      link_selector: "h2.cargo a"
      description_selector: ".detalhes p"
      company_selector: ".emprVaga"
      location_selector: ".vaga-local"
      remote: true            # listagem já é de home office
      resolve_direct: true    # baixa página da vaga e extrai link Gupy/empresa
      max_pages: 2

  # Catho (listagem de estágio home office — HTML estável, httpx+bs4)
  - name: catho_estagio
    enabled: true
    type: html_job
    kind: estagio
    url: "https://www.catho.com.br/vagas/estagio-home-office/"
    rate_limit: 3.0
    params:
      selector: "article.offer"
      title_selector: "h2.title_offer a"
      link_selector: "h2.title_offer a"
      company_selector: "p.mb-2 .text-12"
      location_selector: "p .i_job_location"
      remote: true            # listagem já é de home office
      resolve_direct: true    # baixa página da vaga e extrai link empresa
      max_pages: 2

  # 99jobs (busca de estágio — títulos truncados no listing, páginas individuais completas)
  - name: jobs99_estagio
    enabled: true
    type: html_job
    kind: estagio
    url: "https://99jobs.com/busca?termo=estagio"
    rate_limit: 3.0
    params:
      selector: "a.new-opportunity-card"
      title_selector: "h1"
      description_selector: ".opportunity-labels"
      company_selector: ".new-opportunity-card-footer"
      remote: false           # detecta "Remoto"/"Presencial" nos labels
      resolve_direct: true
      max_pages: 1            # page=2 redireciona para a home (repete cards)

  # Busca por empresa-alvo (Gupy/LinkedIn/Indeed via site:) — links diretos
  - name: empresas_alvo
    enabled: true
    type: search
    kind: estagio
    rate_limit: 2.0

  # Feed RSS de vagas (era fonte acadêmica; category=job exige grupo `sources`
  # para ir a jobs.db e ser alertado pelo `jobs alert` — academic alert ignora job)
  - name: code4lib_jobs
    enabled: true
    type: rss
    url: "https://jobs.code4lib.org/feed/"
    category: "job"
    rate_limit: 2.0

# Call for Papers / Eventos Acadêmicos
# Fontes para CFPs, conferências, workshops em filosofia/humanidades da tecnologia
academic_sources:
  # DESATIVADO no Pi: domínio extinto (DNS -> 0.0.0.0) e exigia Playwright/Chromium.
  - name: upenn_cfp
    enabled: false
    type: html
    url: "https://call-for-papers.sas.upenn.edu"
    category: "publicacao"
    rate_limit: 3.0
    params:
      # Slugs de categoria do site UPenn (adicionar mais conforme necessário)
      categories:
        - "humanities-computing-and-the-internet"
        - "science-and-culture"
      max_pages: 3

  - name: wikicfp
    enabled: true
    type: rss
    url: "https://wikicfp.com/cfp/servlet/event.showcfp?feed=rss"
    category: "cfp"
    rate_limit: 3.0
    params:
      # WikiCFP permite filtrar por categoria via URL
      # Categorias relevantes: philosophy, humanities, digital-humanities, technology
      categories: ["philosophy", "humanities", "digital-humanities", "technology", "social-sciences", "education"]

  - name: hnet_announcements
    enabled: true
    type: rss
    url: "https://networks.h-net.org/rss/announcements"
    category: "event"
    rate_limit: 3.0
    params:
      keywords: ["digital humanities", "philosophy of technology", "science communication", "public humanities", "digital scholarship", "cultural heritage", "history of technology", "media studies", "critical theory"]

  - name: dhnow_cfps
    enabled: true
    type: rss
    url: "https://digitalhumanitiesnow.org/category/news/cfp/feed/"
    category: "cfp"
    rate_limit: 2.0

  - name: dhnow_conferences
    enabled: true
    type: rss
    url: "https://digitalhumanitiesnow.org/category/news/conference/feed/"
    category: "event"
    rate_limit: 2.0

  - name: philpapers_cfp
    enabled: true
    type: rss
    url: "https://philpapers.org/rss/cfp/"
    category: "cfp"
    rate_limit: 3.0

  - name: ala_techsource
    enabled: true
    type: rss
    url: "https://www.ala.org/tools/feed/rss/technology"
    category: "event"
    rate_limit: 3.0

  # DESATIVADO no Pi: URL retorna 404 e a fonte exigia Playwright/Chromium.
  # Substituída por dhsi_feed (RSS oficial, sem navegador).
  - name: dhsi_cfps
    enabled: false
    type: html
    url: "https://dhsi.org/cfps/"
    category: "cfp"
    rate_limit: 5.0
    params:
      selector: "article, .post, .entry, .cfp-item"
      title_selector: "h1, h2, h3, .entry-title, .post-title"
      link_selector: "a"
      date_selector: "time, .date, .published"
      description_selector: ".entry-content, .post-content, .excerpt"

  # DESATIVADO no Pi: URL retorna 404 e a fonte exigia Playwright/Chromium.
  # Substituída por ach_rss (RSS oficial, sem navegador).
  - name: ach_announcements
    enabled: false
    type: html
    url: "https://ach.org/category/announcements/"
    category: "event"
    rate_limit: 5.0
    params:
      selector: "article, .post, .entry"
      title_selector: "h1, h2, h3, .entry-title"
      link_selector: "a"
      date_selector: "time, .date"
      description_selector: ".entry-content, .excerpt"

  # Substitutos RSS das fontes HTML mortas (sem Playwright, leves no Pi 3B)
  - name: dhsi_feed
    enabled: true
    type: rss
    url: "https://dhsi.org/feed/"
    category: "cfp"
    rate_limit: 5.0

  - name: ach_rss
    enabled: true
    type: rss
    url: "https://ach.org/rss.xml"
    category: "event"
    rate_limit: 5.0

  # Scraping configurável genérico - adicione suas fontes aqui
  # Exemplo:
  # - name: minha_fonte_custom
  #   enabled: false
  #   type: html
  #   url: "https://exemplo.com/cfps"
  #   category: "cfp"
  #   rate_limit: 5.0
  #   params:
  #     selector: ".item, .post, article"
  #     title_selector: "h2 a, h3 a, .title a"
  #     link_selector: "a"
  #     date_selector: ".date, time"
  #     description_selector: ".content, .excerpt, p"

# Busca web acadêmica (só trilhos bolsa/publicacao/evento — sem vagas)
# Motores: ddgs (lib FOSS, sem chave) + marginalia (API pública free)
academic_search:
  enabled: true
  engines: ["ddgs", "marginalia"]
  timelimit: "m"          # ddgs: d|w|m|y (alinhado à política de 30 dias)
  max_results_per_query: 10
  page_budget: 40         # teto de páginas por rodada (Pi 3B: 1 GB RAM)
  request_delay: 2.0      # segundos entre downloads (educação com os sites)
  exclude_domains:
    - "linkedin.com"
    - "facebook.com"
    - "instagram.com"
    - "twitter.com"
    - "x.com"
    - "tiktok.com"
    - "wikipedia.org"
    - "youtube.com"
