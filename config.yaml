# Alertas
alerts:
  telegram:
    enabled: false  # DESATIVADO no Pi — alertas apenas por e-mail (SMTP)
    bot_token: "SEU_BOT_TOKEN_AQUI"
    chat_id: "SEU_CHAT_ID_AQUI"
  email:
    enabled: true  # defina true + configure SMTP em .env
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    smtp_user: "SEU_EMAIL@gmail.com"
    smtp_pass: "SUA_SENHA_DE_APP"
    from_email: "SEU_EMAIL@gmail.com"
    to_email: "EMAIL_DE_DESTINO@gmail.com"

# Armazenamento — bancos separados por domínio
storage:
  db_path_jobs: "jobs.db"          # vagas/estágios (category = job)
  db_path_academic: "academic.db"  # bolsas/eventos/chamadas (category != job)
  db_path: "items.db"              # legado: backup pré-separação / fallback
  dedup_by: "url_hash"  # url_hash | title_company

# Execução
runtime:
  user_agent: "Mozilla/5.0 (compatible; JobPipeline/1.0; +https://github.com)"
  timeout: 30
  max_retries: 3
